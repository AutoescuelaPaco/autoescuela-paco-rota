<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Autoescuela Paco en Rota (Cádiz), fundada en 1965. Más de 60 años de experiencia, profesores titulados y formación para los permisos B y AM.">
<meta name="robots" content="index,follow">

<title>Autoescuela Paco | Desde 1965 en Rota</title>

<style>

:root{
  --azul:#294cb0;
  --azul-oscuro:#1d367f;
  --rojo:#f44739;
  --verde:#25d366;
  --texto:#18243a;
  --gris:#657084;
  --fondo:#f6f8fc;
  --blanco:#fff;
  --borde:#e1e6ef;
  --sombra:0 12px 32px rgba(24,36,58,.09);
  --radio:18px;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--texto);
  line-height:1.6;
  background:#fff;
}

a{
  color:inherit;
}

.container{
  width:min(1120px,92%);
  margin:auto;
}


/* =========================================================
   CABECERA
   ========================================================= */

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(255,255,255,.97);
  border-bottom:1px solid var(--borde);
  backdrop-filter:blur(8px);
}

.header-inner{
  min-height:78px;
  display:flex;
  align-items:center;
  gap:18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:13px;
  text-decoration:none;
  margin-right:auto;
}

.brand img{
  width:58px;
  height:58px;
  object-fit:contain;
  border-radius:50%;
}

.brand-text{
  font-weight:900;
  font-size:1.45rem;
  line-height:1;
  letter-spacing:-.03em;
}

.brand-text small{
  display:block;
  margin-top:5px;
  font-size:.70rem;
  font-weight:700;
  color:var(--gris);
  letter-spacing:.03em;
}

nav{
  display:flex;
  gap:16px;
  align-items:center;
}

nav a{
  text-decoration:none;
  font-size:.82rem;
  font-weight:800;
}

nav a:hover{
  color:var(--azul);
}

.menu-btn{
  display:none;
  border:0;
  background:var(--azul);
  color:#fff;
  border-radius:10px;
  padding:10px 12px;
  font-size:1.05rem;
}


/* =========================================================
   PORTADA
   ========================================================= */

.hero{
  padding:26px 0 70px;
  background:#fff;
}


/* Banda azul superior de la portada */

.hero-brand-band{
  background:var(--azul);
  color:#fff;
  border-radius:18px 18px 0 0;
  padding:19px 20px 18px;
  text-align:center;
  box-shadow:0 8px 20px rgba(24,36,58,.08);
}

.hero-brand-band h1{
  margin:0;
  font-size:clamp(2rem,6vw,3.7rem);
  line-height:1;
  font-weight:900;
  letter-spacing:-.035em;
  color:#fff;
}


/* Foto principal */

.hero-photo-wrap{
  position:relative;
}

.hero-photo{
  height:min(66vw,530px);
  min-height:300px;
  overflow:hidden;
  background:#e9edf5;
  box-shadow:var(--sombra);
}

.hero-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}


/* Banda azul inferior de la foto */

.hero-years-band{
  background:var(--azul);
  color:#fff;
  text-align:center;
  padding:16px 20px 17px;
  border-radius:0 0 18px 18px;
}

.hero-years-band strong{
  display:block;
  font-size:clamp(1.15rem,4vw,1.7rem);
  line-height:1.15;
  font-weight:900;
}


/* Texto y botones */

.hero-copy{
  text-align:center;
  max-width:850px;
  margin:25px auto 0;
}

.hero-copy p{
  max-width:720px;
  margin:18px auto 0;
  font-size:1.08rem;
  color:var(--gris);
}

.actions{
  display:flex;
  justify-content:center;
  gap:11px;
  flex-wrap:wrap;
  margin-top:20px;
}

.action{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-width:145px;
  padding:12px 17px;
  border-radius:12px;
  text-decoration:none;
  font-weight:900;
  border:2px solid transparent;
  transition:.2s;
}

.action svg{
  width:18px;
  height:18px;
  fill:currentColor;
}

.action:hover{
  transform:translateY(-1px);
}


/* Botón teléfono */

.action-phone{
  background:var(--rojo);
  color:#fff;
  border-color:var(--rojo);
}


/* Botón mapas */

.action-map{
  background:var(--azul);
  color:#fff;
  border-color:var(--azul);
}


/* Botón WhatsApp */

.action-whatsapp{
  background:var(--verde);
  color:#fff;
  border-color:var(--verde);
}


/* =========================================================
   BLOQUE HISTORIA INICIAL
   ========================================================= */

.hero-history{
  max-width:850px;
  margin:32px auto 0;
  text-align:center;
}

.hero-history-badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:var(--azul);
  color:#fff;
  padding:9px 20px;
  border-radius:12px;
  font-weight:900;
  font-size:.95rem;
  margin-bottom:15px;
}

.hero-history h2{
  margin:0 0 10px;
  font-size:clamp(1.9rem,5vw,3rem);
  line-height:1.05;
  color:var(--texto);
  letter-spacing:-.025em;
}

.hero-history p{
  margin:0;
  color:var(--gris);
  font-size:1.05rem;
}


/* =========================================================
   SECCIONES
   ========================================================= */

section{
  padding:78px 0;
}

section.alt{
  background:var(--fondo);
}

.section-intro{
  text-align:center;
  max-width:790px;
  margin:0 auto 38px;
}

.eyebrow{
  text-transform:uppercase;
  letter-spacing:.13em;
  font-weight:900;
  font-size:.72rem;
  color:var(--rojo);
}

h2{
  font-size:clamp(2rem,4.5vw,3.2rem);
  line-height:1.05;
  letter-spacing:-.025em;
  margin:8px 0 15px;
  color:var(--texto);
}

.section-intro h2{
  color:var(--azul);
}

.lead{
  font-size:1.07rem;
  color:var(--gris);
  margin:0;
}

.two{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:38px;
  align-items:center;
}

.photo{
  min-height:310px;
  border:2px dashed #bcc6d5;
  border-radius:var(--radio);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
  font-weight:900;
  letter-spacing:.05em;
  color:#78859a;
  background:#fff;
}


/* =========================================================
   HISTORIA
   ========================================================= */

.history-number{
  display:inline-flex;
  align-items:center;
  gap:9px;
  color:var(--azul);
  font-weight:900;
  margin-top:12px;
}

.history-number:before{
  content:"";
  width:34px;
  height:4px;
  border-radius:4px;
  background:var(--rojo);
}


/* =========================================================
   FORMACIÓN
   ========================================================= */

.card-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.card{
  background:#fff;
  border:1px solid var(--borde);
  border-radius:var(--radio);
  padding:18px;
  box-shadow:var(--sombra);
}

.card .photo{
  min-height:210px;
  margin-bottom:20px;
}

.card-label{
  font-size:.72rem;
  text-transform:uppercase;
  letter-spacing:.11em;
  font-weight:900;
  color:var(--rojo);
}

.card h3{
  font-size:1.35rem;
  line-height:1.15;
  margin:5px 0 9px;
  color:var(--azul);
}

.card p{
  margin:0;
  color:var(--gris);
}


/* =========================================================
   TARJETAS INTERACTIVAS
   ========================================================= */

.feature-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
}

.feature{
  background:#fff;
  border:1px solid var(--borde);
  border-radius:var(--radio);
  padding:22px;
  box-shadow:var(--sombra);
  position:relative;
  min-height:165px;
}

.feature-tag{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:34px;
  height:34px;
  border-radius:50%;
  background:#edf1ff;
  color:var(--azul);
  font-weight:900;
  margin-bottom:14px;
}

.feature h3{
  font-size:1.03rem;
  line-height:1.2;
  margin:0 35px 8px 0;
}

.feature p{
  font-size:.92rem;
  color:var(--gris);
  margin:0;
}

.feature button{
  position:absolute;
  right:16px;
  top:16px;
  width:34px;
  height:34px;
  border:0;
  border-radius:50%;
  background:var(--azul);
  color:#fff;
  font-size:1.25rem;
  cursor:pointer;
}


/* =========================================================
   PRÁCTICAS
   ========================================================= */

.hours-box{
  margin-top:22px;
  padding:20px;
  border-radius:15px;
  background:#fff;
  border:1px solid var(--borde);
}

.hours-box strong{
  display:block;
  color:var(--azul);
  margin-bottom:4px;
}


/* =========================================================
   DESTACADO
   ========================================================= */

.highlight{
  background:var(--azul);
  color:#fff;
  border-radius:24px;
  padding:42px;
}

.highlight .eyebrow{
  color:#fff;
}

.highlight h2{
  color:#fff;
}

.highlight p{
  max-width:860px;
  color:rgba(255,255,255,.9);
}

.highlight strong{
  color:#fff;
}


/* =========================================================
   PERMISOS
   ========================================================= */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.stat{
  background:#fff;
  border:1px solid var(--borde);
  border-radius:var(--radio);
  padding:25px;
  box-shadow:var(--sombra);
}

.stat strong{
  display:block;
  font-size:2.35rem;
  line-height:1;
  color:var(--rojo);
  margin-bottom:10px;
}

.stat p{
  margin:0;
  color:var(--gris);
}


/* =========================================================
   RECURSOS
   ========================================================= */

.resource-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.resource{
  background:#fff;
  border:1px solid var(--borde);
  border-radius:var(--radio);
  padding:25px;
  box-shadow:var(--sombra);
}

.resource .photo{
  min-height:230px;
  margin-bottom:20px;
}

.resource h3{
  color:var(--azul);
  font-size:1.4rem;
  margin:0 0 8px;
}

.resource p{
  color:var(--gris);
}

.resource a{
  display:inline-flex;
  margin-top:7px;
  background:var(--azul);
  color:#fff;
  text-decoration:none;
  padding:11px 16px;
  border-radius:10px;
  font-weight:900;
}


/* =========================================================
   REDES
   ========================================================= */

.social-head{
  text-align:center;
  max-width:700px;
  margin:0 auto 28px;
}

.social-head .brand-name{
  font-size:clamp(2rem,5vw,3.2rem);
  font-weight:900;
  line-height:1;
  color:var(--azul);
  letter-spacing:-.03em;
}

.social-head h2{
  font-size:1.25rem;
  margin:7px 0 9px;
  color:var(--rojo);
  letter-spacing:0;
}

.social-head p{
  margin:0;
  color:var(--gris);
}

.socials{
  display:flex;
  justify-content:center;
  gap:15px;
  flex-wrap:wrap;
}

.social{
  width:58px;
  height:58px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  background:var(--azul);
  color:#fff;
  box-shadow:var(--sombra);
  transition:.2s;
}

.social:hover{
  transform:translateY(-2px);
  background:var(--azul-oscuro);
}

.social svg{
  width:27px;
  height:27px;
  fill:currentColor;
}


/* =========================================================
   CONTACTO
   ========================================================= */

.contact-intro{
  max-width:720px;
  margin-bottom:30px;
}

.contact-intro .brand-name{
  font-size:clamp(2.25rem,6vw,3.6rem);
  font-weight:900;
  line-height:1;
  color:var(--azul);
  letter-spacing:-.04em;
}

.contact-intro h2{
  font-size:1.25rem;
  margin:8px 0 8px;
  color:var(--rojo);
  letter-spacing:0;
}

.contact-intro p{
  margin:0;
  color:var(--gris);
}

.contact-grid{
  display:grid;
  grid-template-columns:1.15fr .85fr;
  gap:24px;
}

.contact-box{
  border:1px solid var(--borde);
  border-radius:var(--radio);
  padding:25px;
  background:#fff;
  box-shadow:var(--sombra);
}

.contact-row{
  padding:14px 0;
  border-bottom:1px solid var(--borde);
}

.contact-row:first-child{
  padding-top:0;
}

.contact-row:last-child{
  border-bottom:0;
  padding-bottom:0;
}

.contact-row strong{
  display:block;
  color:var(--azul);
  margin-bottom:2px;
}

.contact-row a{
  color:var(--texto);
  font-weight:800;
  text-decoration:none;
}

.contact-map{
  min-height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.contact-map .mini-title{
  font-size:1.2rem;
  font-weight:900;
  color:var(--azul);
  margin-bottom:8px;
}

.map-button{
  display:inline-flex;
  align-self:flex-start;
  margin-top:14px;
  background:var(--rojo);
  color:#fff;
  text-decoration:none;
  border-radius:10px;
  padding:11px 16px;
  font-weight:900;
}


/* =========================================================
   MODAL
   ========================================================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(7,17,38,.62);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:2000;
}

.modal.show{
  display:flex;
}

.modal-box{
  background:#fff;
  max-width:620px;
  width:100%;
  border-radius:20px;
  padding:30px;
  position:relative;
}

.modal-box h3{
  color:var(--azul);
  font-size:1.5rem;
  margin:0 35px 10px 0;
}

.modal-box p{
  color:var(--gris);
  margin:0;
}

.modal-close{
  position:absolute;
  right:13px;
  top:8px;
  border:0;
  background:transparent;
  font-size:1.8rem;
  cursor:pointer;
}


/* =========================================================
   PIE
   ========================================================= */

footer{
  background:#13224d;
  color:#fff;
  padding:35px 0;
}

footer strong{
  font-size:1.05rem;
}

footer p{
  margin:5px 0;
  color:#dbe3f8;
  font-size:.88rem;
}


/* =========================================================
   TABLET
   ========================================================= */

@media(max-width:900px){

  nav{
    display:none;
    position:absolute;
    left:0;
    right:0;
    top:78px;
    background:#fff;
    padding:18px 4%;
    border-bottom:1px solid var(--borde);
    flex-direction:column;
    align-items:flex-start;
  }

  nav.open{
    display:flex;
  }

  .menu-btn{
    display:block;
  }

  .two,
  .contact-grid{
    grid-template-columns:1fr;
  }

  .card-grid{
    grid-template-columns:1fr;
  }

  .feature-grid{
    grid-template-columns:1fr 1fr;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .resource-grid{
    grid-template-columns:1fr;
  }

  .hero{
    padding-top:18px;
  }

}


/* =========================================================
   MÓVIL
   ========================================================= */

@media(max-width:560px){

  section{
    padding:58px 0;
  }

  .header-inner{
    min-height:70px;
  }

  .brand img{
    width:48px;
    height:48px;
  }

  .brand-text{
    font-size:1.18rem;
  }

  .brand-text small{
    font-size:.62rem;
  }

  .hero-brand-band{
    border-radius:14px 14px 0 0;
    padding:16px 10px;
  }

  .hero-brand-band h1{
    font-size:clamp(1.75rem,8vw,2.5rem);
    white-space:nowrap;
  }

  .hero-photo{
    height:74vw;
    min-height:260px;
    border-radius:0;
  }

  .hero-years-band{
    border-radius:0 0 14px 14px;
    padding:14px 12px;
  }

  .hero-years-band strong{
    font-size:1.08rem;
  }

  .hero-copy{
    margin-top:20px;
  }

  .hero-copy p{
    font-size:1rem;
  }

  .actions{
    display:grid;
    grid-template-columns:1fr;
    gap:9px;
  }

  .action{
    width:100%;
  }

  .hero-history{
    margin-top:28px;
  }

  .hero-history-badge{
    margin-bottom:13px;
  }

  .hero-history h2{
    font-size:2rem;
  }

  .hero-history p{
    font-size:.98rem;
  }

  .feature-grid{
    grid-template-columns:1fr;
  }

  .highlight{
    padding:28px 22px;
    border-radius:18px;
  }

  .photo{
    min-height:240px;
  }

  .social{
    width:54px;
    height:54px;
  }

}


/* =========================================================
   PANTALLAS MUY PEQUEÑAS
   ========================================================= */

@media(max-width:380px){

  .brand-text{
    font-size:1.05rem;
  }

  .brand img{
    width:44px;
    height:44px;
  }

  .hero-brand-band h1{
    font-size:1.6rem;
  }

}


/* =========================================================
   ACCESIBILIDAD
   ========================================================= */

@media(prefers-reduced-motion:reduce){

  html{
    scroll-behavior:auto;
  }

  .action,
  .social{
    transition:none;
  }

}

</style>
</head>


<body>


<!-- =====================================================
     CABECERA
     ===================================================== -->

<header>

  <div class="container header-inner">

    <a class="brand" href="#inicio" aria-label="Autoescuela Paco">

      <img
        src="Screenshot_2026-08-26-18-26-26-723_com.miui.gallery-edit.jpg"
        alt="Logotipo de Autoescuela Paco"
      >

      <span class="brand-text">
        Autoescuela Paco
        <small>Desde 1965 · Rota</small>
      </span>

    </a>


    <button
      class="menu-btn"
      onclick="toggleMenu()"
      aria-label="Abrir menú"
    >
      ☰
    </button>


    <nav id="menu">

      <a href="#historia">Historia</a>
      <a href="#formacion">Formación</a>
      <a href="#practicas">Prácticas</a>
      <a href="#permisos">Permisos</a>
      <a href="#revista">60 años</a>
      <a href="#blog">Blog</a>
      <a href="#contacto">Contacto</a>

    </nav>

  </div>

</header>



<main>


<!-- =====================================================
     PORTADA
     ===================================================== -->

<section class="hero" id="inicio">

  <div class="container">


    <!-- NOMBRE DEL NEGOCIO ENCIMA DE LA FOTO -->

    <div class="hero-brand-band">

      <h1>AUTOESCUELA PACO</h1>

    </div>


    <!-- FOTO PRINCIPAL -->

    <div class="hero-photo-wrap">

      <div class="hero-photo">

        <img
          src="Screenshot_2026-09-15-11-59-43-282_com.miui.gallery-edit.jpg"
          alt="Vehículos de Autoescuela Paco en Rota"
        >

      </div>

    </div>


    <!-- TEXTO AZUL DEBAJO DE LA FOTO -->

    <div class="hero-years-band">

      <strong>
        Más de 60 años formando conductores en Rota
      </strong>

    </div>


    <!-- BOTONES -->

    <div class="hero-copy">


      <div class="actions">


        <!-- LLAMAR -->

        <a
          class="action action-phone"
          href="tel:+34956811540"
        >

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M6.6 10.8a15.5 15.5 0 0 0 6.6 6.6l2.2-2.2c.3-.3.8-.4 1.2-.2 1.3.4 2.6.7 4 .7.7 0 1.2.5 1.2 1.2V20c0 .7-.5 1.2-1.2 1.2C11.4 21.2 2.8 12.6 2.8 3.4 2.8 2.7 3.3 2.2 4
