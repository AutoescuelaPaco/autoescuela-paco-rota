<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autoescuela Paco | Desde 1965 en Rota</title>

<style>
:root {
  --azul-brand: #2042b5;
  --verde-wsp: #25d366;
  --fondo-general: #0b0f19;
  --contenedor-bg: #111827;
  --borde-color: rgba(255, 255, 255, 0.08);
  --texto-blanco: #ffffff;
  --texto-gris: #9ca3af;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background-color: var(--fondo-general);
  color: var(--texto-blanco);
  line-height: 1.5;
}

a {
  text-decoration: none;
  color: inherit;
}

/* =========================================
   CABECERA PRINCIPAL (ESTILO EXACTO FOTO)
   ========================================= */
header {
  background-color: var(--fondo-general);
  border-bottom: 1px solid var(--borde-color);
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand-group {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-logo {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid rgba(255,255,255,0.15);
}

.brand-titles h1 {
  margin: 0;
  font-size: 1.1rem;
  font-weight: 900;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.brand-titles p {
  margin: 0;
  font-size: 0.75rem;
  color: var(--texto-gris);
  font-weight: 600;
}

/* Botón WhatsApp Superior */
.whatsapp-btn-top {
  background-color: var(--verde-wsp);
  color: #fff;
  padding: 8px 16px;
  border-radius: 20px;
  font-weight: 700;
  font-size: 0.85rem;
  display: flex;
  align-items: center;
  gap: 6px;
  box-shadow: 0 4px 12px rgba(37, 211, 102, 0.2);
}

.whatsapp-btn-top svg {
  width: 18px;
  height: 18px;
  fill: currentColor;
}

/* Menú de Navegación Horizontal */
.nav-bar {
  background-color: #080c14;
  border-bottom: 1px solid var(--borde-color);
  padding: 12px 0;
}

.nav-links {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 16px;
  display: flex;
  justify-content: center;
  gap: 32px;
}

.nav-links a {
  font-size: 0.9rem;
  font-weight: 800;
  letter-spacing: 1px;
  color: var(--texto-blanco);
  text-transform: uppercase;
  transition: color 0.2s;
}

.nav-links a:hover {
  color: #4f73ff;
}

/* =========================================
   SECCIÓN PRINCIPAL (HERO)
   ========================================= */
.main-section {
  max-width: 900px;
  margin: 30px auto;
  padding: 0 16px;
  text-align: center;
}

/* Tarjeta contenedora de la foto y la franja */
.hero-card {
  background-color: var(--contenedor-bg);
  border: 1px solid var(--borde-color);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

/* Franja Azul Superior */
.hero-banner-blue {
  background-color: var(--azul-brand);
  color: #fff;
  padding: 18px 20px;
  font-weight: 900;
  font-size: clamp(0.95rem, 2.5vw, 1.25rem);
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

/* Contenedor de la Imagen */
.hero-image-wrapper {
  width: 100%;
  max-height: 480px;
  overflow: hidden;
}

.hero-image-wrapper img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* Textos inferiores */
.hero-content-bottom {
  margin-top: 35px;
}

.hero-content-bottom h2 {
  font-size: clamp(1.6rem, 4vw, 2.3rem);
  font-weight: 900;
  margin: 0 0 12px 0;
  letter-spacing: -0.5px;
  text-transform: uppercase;
  color: var(--texto-blanco);
}

.hero-content-bottom p {
  font-size: 1.05rem;
  color: var(--texto-gris);
  margin: 0;
  font-weight: 400;
}

/* RESPONSIVE MÓVIL */
@media (max-width: 600px) {
  .nav-links {
    gap: 16px;
    justify-content: space-around;
  }
  .nav-links a {
    font-size: 0.78rem;
  }
  .brand-titles h1 {
    font-size: 0.95rem;
  }
  .whatsapp-btn-top span {
    display: none; /* Oculta la palabra WhatsApp en móviles muy estrechos si sobra, o déjalo si prefieres */
  }
}
</style>
</head>
<body>

  <!-- CABECERA -->
  <header>
    <div class="header-container">
      <div class="brand-group">
        <img src="Screenshot_2026-08-26-18-26-26-723_com.miui.gallery-edit.jpg" alt="Logo Autoescuela Paco" class="brand-logo">
        <div class="brand-titles">
          <h1>Autoescuela Paco</h1>
          <p>Desde 1965 &middot; Rota</p>
        </div>
      </div>

      <a href="https://wa.me/34672046418" class="whatsapp-btn-top" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M20 3.9A10 10 0 0 0 4.3 16.4L3 21l4.7-1.2A10 10 0 0 0 20 3.9zm-8 16.3c-1.6 0-3.1-.4-4.4-1.2l-.3-.2-2.8.7-.8-2.7-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.2-.6-1.4-.7-.2-.1-.3-.1-.5.1-.1.2-.5.7-.6.9-.1.2-.2.2-.4.1-1.2-.6-2.1-1.5-2.8-2.7-.1-.2 0-.3.1-.4l.4-.5c.1-.1.2-.4.2-.4s0-.3-.1-.5l-.6-1.4c-.2-.4-.3-.4-.5-.4h-.4c-.2 0-.4.1-.6.3-.2.2-.7.7-.7 1.7s.7 2 .8 2.1c.1.1 1.4 2.2 3.4 3 .5.2.9.3 1.2.4.5.2 1 .2 1.4.1.4-.1 1.2-.5 1.4-1 .2-.5.2-.9.1-1-.1-.1-.2-.1-.4-.2z"/></svg>
        <span>WhatsApp</span>
      </a>
    </div>

    <nav class="nav-bar">
      <div class="nav-links">
        <a href="#inicio">Inicio</a>
        <a href="#cursos">Cursos</a>
        <a href="#nosotros">Nosotros</a>
        <a href="#contacto">Contacto</a>
      </div>
    </nav>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="main-section">
    <div class="hero-card">
      <div class="hero-banner-blue">
        60 AÑOS FORMANDO CONDUCTORES EN ROTA
      </div>
      <div class="hero-image-wrapper">
        <img src="Screenshot_2026-09-15-11-59-43-282_com.miui.gallery-edit.jpg" alt="Coches de Autoescuela Paco">
      </div>
    </div>

    <div class="hero-content-bottom">
      <h2>Una trayectoria que mira al futuro</h2>
      <p>Desde 1965, enseñando a conducir con experiencia y confianza.</p>
    </div>
  </main>

</body>
</html>
