<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Autoescuela Paco en Rota (Cádiz), fundada en 1965. Más de 60 años de experiencia, profesores titulados y formación vial.">
<meta name="robots" content="index,follow">
<title>Autoescuela Paco | Desde 1965 en Rota</title>

<style>
:root{
  --negro:#000;
  --negro-suave:#0b0b0b;
  --negro-card:#111;
  --negro-footer:#050505;
  --blanco:#fff;
  --blanco-suave:#f2f2f2;
  --gris-claro:#c7c7c7;
  --gris:#999;
  --gris-oscuro:#252525;
  --rojo:#e53935;
  --azul-btn:#1e3a8a;
  --verde:#25d366;
  --texto:#fff;
  --borde:#222;
  --sombra:0 8px 24px rgba(0,0,0,.4);
  --radio:14px;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--texto);
  line-height:1.5;
  background:var(--negro);
  overflow-x:hidden;
  padding-top: 100px; /* Espacio para la cabecera fija */
  padding-bottom: 85px; /* Espacio para la barra fija de botones */
}

a{
  color:inherit;
  text-decoration:none;
}

.container{
  width:min(1120px,92%);
  margin:auto;
}

/* =========================
   CABECERA FIJA SUPERIOR
   ========================= */
header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:1000;
  background:var(--negro);
  border-bottom:1px solid #1a1a1a;
  box-shadow:0 4px 12px rgba(0,0,0,.5);
}

.header-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 16px;
  background:var(--negro);
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand img{
  width:36px;
  height:36px;
  object-fit:cover;
  border-radius:50%;
  border:2px solid rgba(255,255,255,0.2);
}

.brand-text{
  font-weight:800;
  font-size:0.95rem;
  line-height:1.1;
  letter-spacing:-.02em;
  color:var(--blanco);
}

/* BOTÓN WHATSAPP EN CABECERA */
.whatsapp-pill-header{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:var(--verde);
  color:#fff;
  padding:6px 12px;
  border-radius:20px;
  font-weight:700;
  font-size:.8rem;
  box-shadow:0 2px 8px rgba(37,211,102,.3);
  white-space:nowrap;
}

.whatsapp-pill-header svg{
  width:15px;
  height:15px;
  fill:currentColor;
}

.nav-bar{
  background:var(--negro-suave);
  border-top:1px solid #151515;
  padding:8px 16px;
  display:flex;
  justify-content:center;
  gap:20px;
  overflow-x:auto;
  white-space:nowrap;
}

.nav-bar::-webkit-scrollbar{
  display:none;
}

.nav-bar a{
  color:var(--blanco);
  font-size:.85rem;
  font-weight:700;
  letter-spacing:.02em;
}

.nav-bar a:hover{
  color:var(--gris-claro);
}

/* =========================
   BARRA FIJA INFERIOR (PERSONALIZADA)
   ========================= */
.fixed-bottom-bar{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  z-index:1000;
  background:rgba(5,5,5,0.96);
  backdrop-filter:blur(10px);
  border-top:1px solid #222;
  padding:12px 16px;
  box-shadow:0 -4px 20px rgba(0,0,0,.8);
}

.cta-buttons{
  display:flex;
  flex-direction:row;
  gap:10px;
  justify-content:center;
  align-items:center;
  width:min(1120px, 100%);
  margin:0 auto;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding:12px 16px;
  border-radius:10px;
  font-weight:800;
  font-size:0.85rem;
  cursor:pointer;
  border:0;
  box-shadow:0 4px 12px rgba(0,0,0,.3);
  text-align:center;
  flex:1;
  white-space:nowrap;
}

.btn:active{
  transform:scale(.98);
}

.btn svg{
  width:18px;
  height:18px;
  fill:currentColor;
}

/* BOTÓN ROJO "EMPIEZA AHORA" */
.btn-primary-rota{
  background:var(--rojo);
  color:#fff;
}

/* BOTÓN AZUL "VER UBICACIÓN" */
.btn-secondary-rota{
  background:var(--azul-btn);
  color:#fff;
}

/* =========================
   ESTILOS DE PORTADA / HERO (LIMPIA)
   ========================= */
.hero{
  padding:20px 0 40px;
  background:var(--negro);
}

.hero-photo-wrap{
  border-radius:var(--radio);
  overflow:hidden;
  box-shadow:var(--sombra);
  border:1px solid #222;
  margin-bottom:25px;
  max-width:850px;
  margin-left:auto;
  margin-right:auto;
  background:#000;
}

.hero-photo img{
  width:100%;
  height:auto;
  display:block;
  max-height:500px;
  object-fit:contain;
}

.hero-content{
  text-align:center;
  max-width:750px;
  margin:0 auto;
}

.hero-content h1{
  margin:0 0 10px;
  font-size:clamp(1.5rem, 4vw, 2.5rem);
  line-height:1.1;
  font-weight:900;
  letter-spacing:-.02em;
  color:#fff;
  text-transform:uppercase;
}

.hero-content p{
  margin:0;
  color:var(--gris-claro);
  font-size:1rem;
  max-width:600px;
  margin:0 auto;
}

/* =========================
   RESTO DE SECCIONES (Ejemplo)
   ========================= */
section{
  padding:40px 0;
}

section.alt{
  background:var(--negro-suave);
}

.section-intro{
  text-align:center;
  max-width:750px;
  margin:0 auto 30px;
}

h2{
  font-size:clamp(1.4rem,3vw,2rem);
  line-height:1.15;
  letter-spacing:-.02em;
  margin:0 0 8px;
  color:var(--blanco);
}

footer{
  background:var(--negro-footer);
  color:#fff;
  border-top:1px solid #1a1a1a;
  padding:30px 0;
  text-align:center;
}

footer p{
  margin:4px 0;
  color:#888;
  font-size:.8rem;
}

@media(max-width:768px){
  .cta-buttons{
    gap:8px;
  }
  .btn{
    font-size:0.75rem;
    padding:10px 12px;
  }
  .whatsapp-pill-header{
    font-size:0.7rem;
    padding:4px 8px;
  }
}
</style>
</head>
